# Встроенный диск адаптера (8 МБ, драйверы для Windows) не нужен: его опрос сбрасывал весь адаптер по USB.
options usb-storage quirks=1d5c:2000:i
# no_foreign_import=1 выключен 21.10: при закрытой крышке GNOME за 6 с занимает 3 ГБ памяти AMD
# (третий раз подряд: 14:39, 15:37, 16:24), дальше нехватка памяти. Не включать, пока не найдена причина.
#options alpha_fl2000 no_foreign_import=1
